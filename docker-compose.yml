services:
  db:
    image: pgvector/pgvector:0.8.0-pg16 # PostgreSQL 16 + the pgvector extension (visual search)
    container_name: vendors-hub-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: vendors
      POSTGRES_PASSWORD: vendors_pass
      POSTGRES_DB: vendors_hub
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
