# Home page billboard banners: public list + admin management.
# Media: JPG, PNG, WebP or GIF (max 5 MB each), re-encoded to WebP (GIF -> animated WebP).
# SVG and video are rejected for now (mediaType SVG / VIDEO are reserved).
paths:
  /api/v1/banners:
    get:
      tags: [Banners]
      operationId: listBanners
      summary: Live home page banners (no login)
      description: |
        Active banners of one placement whose schedule includes now (startsAt null or <= now, endsAt null or > now),
        ordered by sortOrder then createdAt. HERO (the slider, the default): at most 12. SIDE_AD (the side
        advertisement): at most 3; the web shows the first. Sent with `Cache-Control: public, max-age=60`.
      parameters:
        - name: placement
          in: query
          required: false
          schema:
            allOf:
              - $ref: '#/components/schemas/BannerPlacement'
            default: HERO
      responses:
        '200':
          description: The banners to show, in order.
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success:
                    type: boolean
                  data:
                    type: array
                    maxItems: 12
                    items:
                      $ref: '#/components/schemas/Banner'
  /api/v1/admin/banners:
    get:
      tags: [Banners]
      operationId: adminListBanners
      summary: All banners, including inactive, scheduled and expired ones (admin)
      description: Optionally only one placement. meta.total always counts every placement (the limit of 12 is shared).
      security:
        - bearerAuth: []
      parameters:
        - name: placement
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/BannerPlacement'
      responses:
        '200':
          description: Every banner, ordered by sortOrder then createdAt.
          content:
            application/json:
              schema:
                type: object
                required: [success, data, meta]
                properties:
                  success:
                    type: boolean
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/AdminBanner'
                  meta:
                    $ref: '#/components/schemas/BannerListMeta'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      tags: [Banners]
      operationId: adminCreateBanner
      summary: Create a banner (admin, multipart)
      description: |
        Send the image in `media` (required) and an optional phone version in `mobileMedia`.
        Size rules per placement:
        - HERO (default): recommended 3:1, e.g. 1800 x 600; at least 900 x 300.
        - SIDE_AD: recommended 2:3, e.g. 600 x 900; at least 300 x 400.
        - Phone version (either placement): at least 400 x 300.
        A smaller image returns 422. A new banner goes to the end of its placement unless sortOrder is given.
        At most 12 banners in total, both placements together (active or not):
        the 13th returns 409 with error.details.code BANNER_LIMIT and no file is kept. Writes an audit log entry.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              allOf:
                - $ref: '#/components/schemas/BannerFields'
                - type: object
                  required: [media, titleEn]
                  properties:
                    media:
                      type: string
                      format: binary
                    mobileMedia:
                      type: string
                      format: binary
      responses:
        '201':
          description: The new banner.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminBannerResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          description: 'The limit of 12 banners is reached. Delete one first. error.details.code is BANNER_LIMIT.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BannerLimitError'
        '413':
          description: A file is larger than 5 MB.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: The image is too small.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /api/v1/admin/banners/reorder:
    patch:
      tags: [Banners]
      operationId: adminReorderBanners
      summary: Set the order of banners (admin)
      description: |
        Sets sortOrder 0, 1, 2 ... in the given order; banners not listed keep theirs. All ids must belong to
        ONE placement (mixing HERO and SIDE_AD is a 400). Returns that placement's banners. Writes an audit log entry.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ids]
              properties:
                ids:
                  type: array
                  minItems: 1
                  maxItems: 120
                  uniqueItems: true
                  items:
                    type: string
                    format: uuid
      responses:
        '200':
          description: All banners in the new order.
          content:
            application/json:
              schema:
                type: object
                required: [success, data, meta]
                properties:
                  success:
                    type: boolean
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/AdminBanner'
                  meta:
                    $ref: '#/components/schemas/BannerListMeta'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/v1/admin/banners/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    patch:
      tags: [Banners]
      operationId: adminUpdateBanner
      summary: Update a banner's fields and/or replace its media (admin)
      description: |
        Changing `placement` without a new `media` keeps the current image only when it meets the new
        placement's minimum size (else 422), and moves the banner to the end of that placement.
        JSON or multipart. In multipart, a new `media` or `mobileMedia` replaces the old file (the old
        file is deleted). An empty string clears an optional field. `removeMobileMedia: true` removes
        the phone version. Writes an audit log entry.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: '#/components/schemas/BannerFields'
                - $ref: '#/components/schemas/BannerUpdateExtra'
          multipart/form-data:
            schema:
              allOf:
                - $ref: '#/components/schemas/BannerFields'
                - $ref: '#/components/schemas/BannerUpdateExtra'
                - type: object
                  properties:
                    media:
                      type: string
                      format: binary
                    mobileMedia:
                      type: string
                      format: binary
      responses:
        '200':
          description: The updated banner.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminBannerResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '413':
          description: A file is larger than 5 MB.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: The image is too small.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          $ref: '#/components/responses/TooManyRequests'
    delete:
      tags: [Banners]
      operationId: adminDeleteBanner
      summary: Delete a banner and its files (admin)
      description: Writes an audit log entry.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Deleted.
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success:
                    type: boolean
                  data:
                    type: object
                    required: [message]
                    properties:
                      message:
                        type: string
                        example: Banner deleted
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

components:
  schemas:
    BannerMedia:
      type: object
      required: [url, thumbUrl, width, height]
      properties:
        url:
          type: string
          format: uri
          description: Processed WebP (animated for GIF banners).
        thumbUrl:
          type: string
          format: uri
          description: Smaller still WebP (first frame for GIF banners).
        width:
          type: integer
        height:
          type: integer
    Banner:
      type: object
      required: [id, titleEn, titleBn, subtitleEn, subtitleBn, mediaType, fit, placement, media, mobileMedia, linkUrl, ctaLabelEn, ctaLabelBn, sortOrder]
      properties:
        id:
          type: string
          format: uuid
        titleEn:
          type: string
          description: Also the alt text of the image.
        titleBn:
          type: string
          nullable: true
        subtitleEn:
          type: string
          nullable: true
        subtitleBn:
          type: string
          nullable: true
        mediaType:
          type: string
          enum: [IMAGE, GIF, SVG, VIDEO]
          description: Only IMAGE and GIF are produced today; SVG and VIDEO are reserved.
        fit:
          $ref: '#/components/schemas/BannerFit'
        placement:
          $ref: '#/components/schemas/BannerPlacement'
        media:
          $ref: '#/components/schemas/BannerMedia'
        mobileMedia:
          allOf:
            - $ref: '#/components/schemas/BannerMedia'
          nullable: true
          description: Optional phone version; use media when null.
        linkUrl:
          type: string
          nullable: true
          description: An internal path ("/markets/x") or an https URL.
        ctaLabelEn:
          type: string
          nullable: true
        ctaLabelBn:
          type: string
          nullable: true
        sortOrder:
          type: integer
    AdminBanner:
      allOf:
        - $ref: '#/components/schemas/Banner'
        - type: object
          required: [isActive, startsAt, endsAt, liveNow, createdAt, updatedAt]
          properties:
            isActive:
              type: boolean
            startsAt:
              type: string
              format: date-time
              nullable: true
            endsAt:
              type: string
              format: date-time
              nullable: true
            liveNow:
              type: boolean
              description: Active and inside its schedule right now (what GET /banners would show).
            createdAt:
              type: string
              format: date-time
            updatedAt:
              type: string
              format: date-time
    AdminBannerResponse:
      type: object
      required: [success, data]
      properties:
        success:
          type: boolean
        data:
          $ref: '#/components/schemas/AdminBanner'
    BannerFields:
      type: object
      properties:
        titleEn:
          type: string
          minLength: 1
          maxLength: 120
        titleBn:
          type: string
          maxLength: 120
          nullable: true
        subtitleEn:
          type: string
          maxLength: 200
          nullable: true
        subtitleBn:
          type: string
          maxLength: 200
          nullable: true
        linkUrl:
          type: string
          maxLength: 500
          nullable: true
          description: 'Starts with "/" (not "//") or is an https:// URL. javascript:, data: and http: links are refused.'
        ctaLabelEn:
          type: string
          maxLength: 40
          nullable: true
        ctaLabelBn:
          type: string
          maxLength: 40
          nullable: true
        sortOrder:
          type: integer
          minimum: 0
          maximum: 10000
        fit:
          $ref: '#/components/schemas/BannerFit'
        placement:
          $ref: '#/components/schemas/BannerPlacement'
        isActive:
          type: boolean
        startsAt:
          type: string
          format: date-time
          nullable: true
        endsAt:
          type: string
          format: date-time
          nullable: true
          description: Must be after startsAt.
    BannerPlacement:
      type: string
      enum: [HERO, SIDE_AD]
      default: HERO
      description: |
        HERO = the home page slider (landscape; recommended 1800 x 600, at least 900 x 300).
        SIDE_AD = the home page side advertisement (tall; recommended 600 x 900, at least 300 x 400).
        Both placements share the limit of 12 banners.
    BannerFit:
      type: string
      enum: [COVER, CONTAIN]
      default: COVER
      description: COVER fills the slide and crops the edges (CSS object-fit cover); CONTAIN shows the whole image.
    BannerListMeta:
      type: object
      required: [total, max]
      properties:
        total:
          type: integer
          description: All banners, active or not.
          example: 8
        max:
          type: integer
          description: The limit; disable "Add banner" when total reaches it.
          example: 12
    BannerLimitError:
      type: object
      required: [success, error]
      properties:
        success:
          type: boolean
          example: false
        error:
          type: object
          required: [message, details]
          properties:
            message:
              type: string
              example: You can have at most 12 banners. Delete one first.
            details:
              type: object
              required: [code]
              properties:
                code:
                  type: string
                  enum: [BANNER_LIMIT]
    BannerUpdateExtra:
      type: object
      properties:
        removeMobileMedia:
          type: boolean
          description: true removes the phone version.
