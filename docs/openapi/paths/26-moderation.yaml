# Curation and moderation.
# Featured: admin-picked shops and products for the home page (max 12 per kind), ordered like banners.
# Moderation: products created by shops start PENDING (older products stay APPROVED). Only APPROVED
#   products appear anywhere public (lists, search, product page, storefront, cart, checkout, deals,
#   featured). Approve or reject (with a reason) notifies the shop team (PRODUCT_MODERATION). A shop
#   that edits a REJECTED product sends it back to PENDING.
# Flags: any logged-in user can report a review or an order-chat message they can see (max 10 per
#   day). Reviews with links, phone numbers or repeated text are flagged automatically. An admin
#   resolves all open flags of a target at once: HIDE (left out of every public list and rating; a
#   hidden chat message shows body null, hidden true) or KEEP. Order bargains have no user-written
#   text (amounts and system notes only), so they cannot be reported.
# Every admin action is audited.
paths:
  /api/v1/featured:
    get:
      tags: [Featured]
      operationId: listFeatured
      summary: Live featured shops or products, in order (no login)
      parameters:
        - name: kind
          in: query
          required: true
          schema:
            $ref: '#/components/schemas/FeaturedKind'
      responses:
        '200':
          description: SHOP items carry `shop`, PRODUCT items carry `product` (effective lowestPrice). Cached 60 s.
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success:
                    type: boolean
                  data:
                    type: array
                    maxItems: 12
                    items:
                      $ref: '#/components/schemas/FeaturedItem'
        '400':
          $ref: '#/components/responses/BadRequest'
  /api/v1/admin/featured:
    get:
      tags: [Featured]
      operationId: adminListFeatured
      summary: All featured slots (admin), with liveNow
      security:
        - bearerAuth: []
      parameters:
        - name: kind
          in: query
          schema:
            $ref: '#/components/schemas/FeaturedKind'
      responses:
        '200':
          $ref: '#/components/responses/FeaturedSlots'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      tags: [Featured]
      operationId: adminCreateFeatured
      summary: Feature a shop or a product (goes to the end; 409 FEATURED_LIMIT at 12, FEATURED_DUPLICATE)
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [kind, targetId]
              properties:
                kind:
                  $ref: '#/components/schemas/FeaturedKind'
                targetId:
                  type: string
                  format: uuid
                startsAt:
                  type: string
                  format: date-time
                  nullable: true
                endsAt:
                  type: string
                  format: date-time
                  nullable: true
      responses:
        '201':
          $ref: '#/components/responses/FeaturedSlotOne'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /api/v1/admin/featured/reorder:
    patch:
      tags: [Featured]
      operationId: adminReorderFeatured
      summary: Set the order of one kind's featured slots (mixed kinds -> 400)
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ids]
              properties:
                ids:
                  type: array
                  minItems: 1
                  uniqueItems: true
                  items:
                    type: string
                    format: uuid
      responses:
        '200':
          $ref: '#/components/responses/FeaturedSlots'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/v1/admin/featured/{id}:
    parameters:
      - $ref: '#/components/parameters/ModId'
    patch:
      tags: [Featured]
      operationId: adminUpdateFeatured
      summary: Change a featured slot's schedule
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              minProperties: 1
              properties:
                startsAt:
                  type: string
                  format: date-time
                  nullable: true
                endsAt:
                  type: string
                  format: date-time
                  nullable: true
      responses:
        '200':
          $ref: '#/components/responses/FeaturedSlotOne'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags: [Featured]
      operationId: adminDeleteFeatured
      summary: Remove a featured slot
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Removed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/v1/admin/moderation/products:
    get:
      tags: [Moderation]
      operationId: adminModerationProducts
      summary: Products by moderation status (default PENDING), oldest first
      security:
        - bearerAuth: []
      parameters:
        - name: status
          in: query
          schema:
            type: string
            enum: [PENDING, APPROVED, REJECTED]
            default: PENDING
        - $ref: '#/components/parameters/ModPage'
        - $ref: '#/components/parameters/ModLimit'
      responses:
        '200':
          description: One page.
          content:
            application/json:
              schema:
                type: object
                required: [success, data, meta]
                properties:
                  success:
                    type: boolean
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/ModerationProduct'
                  meta:
                    type: object
                    properties:
                      pagination:
                        $ref: '#/components/schemas/Pagination'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/v1/admin/moderation/products/{id}/approve:
    parameters:
      - $ref: '#/components/parameters/ModId'
    post:
      tags: [Moderation]
      operationId: adminApproveProduct
      summary: Approve a product (it becomes public; the shop is notified)
      security:
        - bearerAuth: []
      responses:
        '200':
          $ref: '#/components/responses/ModerationDecision'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /api/v1/admin/moderation/products/{id}/reject:
    parameters:
      - $ref: '#/components/parameters/ModId'
    post:
      tags: [Moderation]
      operationId: adminRejectProduct
      summary: Reject a product with a reason (hidden from the public; the shop is notified)
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason:
                  type: string
                  minLength: 3
                  maxLength: 300
      responses:
        '200':
          $ref: '#/components/responses/ModerationDecision'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /api/v1/flags:
    post:
      tags: [Moderation]
      operationId: reportContent
      summary: Report a review or an order-chat message (any logged-in user, max 10 per day)
      description: 201 for a new report, 200 when this user already reported it. A chat message can only be reported by the order's customer or shop team (else 404); your own content cannot be reported (400). 429 FLAG_LIMIT after 10 reports in 24 hours.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [targetType, targetId, reason]
              properties:
                targetType:
                  $ref: '#/components/schemas/FlagTarget'
                targetId:
                  type: string
                  format: uuid
                reason:
                  $ref: '#/components/schemas/FlagReason'
                note:
                  type: string
                  maxLength: 500
      responses:
        '200':
          $ref: '#/components/responses/FlagCreated'
        '201':
          $ref: '#/components/responses/FlagCreated'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /api/v1/admin/flags:
    get:
      tags: [Moderation]
      operationId: adminListFlags
      summary: Reports by status (default OPEN), oldest first, with the reported content
      security:
        - bearerAuth: []
      parameters:
        - name: status
          in: query
          schema:
            type: string
            enum: [OPEN, HIDDEN, KEPT]
            default: OPEN
        - name: targetType
          in: query
          schema:
            $ref: '#/components/schemas/FlagTarget'
        - $ref: '#/components/parameters/ModPage'
        - $ref: '#/components/parameters/ModLimit'
      responses:
        '200':
          description: One page. Reporter identities are never shown.
          content:
            application/json:
              schema:
                type: object
                required: [success, data, meta]
                properties:
                  success:
                    type: boolean
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/AdminFlag'
                  meta:
                    type: object
                    properties:
                      pagination:
                        $ref: '#/components/schemas/Pagination'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/v1/admin/flags/{id}/resolve:
    parameters:
      - $ref: '#/components/parameters/ModId'
    post:
      tags: [Moderation]
      operationId: adminResolveFlag
      summary: Hide or keep the reported content (resolves every open flag of it)
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [action]
              properties:
                action:
                  type: string
                  enum: [HIDE, KEEP]
                note:
                  type: string
                  maxLength: 500
      responses:
        '200':
          description: Resolved.
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success:
                    type: boolean
                  data:
                    type: object
                    required: [status, resolvedFlags]
                    properties:
                      status:
                        type: string
                        enum: [HIDDEN, KEPT]
                      resolvedFlags:
                        type: integer
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

components:
  parameters:
    ModId:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ModPage:
      name: page
      in: query
      schema:
        type: integer
        minimum: 1
        default: 1
    ModLimit:
      name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 50
        default: 20
  responses:
    FeaturedSlots:
      description: Featured slots.
      content:
        application/json:
          schema:
            type: object
            required: [success, data]
            properties:
              success:
                type: boolean
              data:
                type: array
                items:
                  $ref: '#/components/schemas/FeaturedSlot'
    FeaturedSlotOne:
      description: The featured slot.
      content:
        application/json:
          schema:
            type: object
            required: [success, data]
            properties:
              success:
                type: boolean
              data:
                $ref: '#/components/schemas/FeaturedSlot'
    ModerationDecision:
      description: The new status.
      content:
        application/json:
          schema:
            type: object
            required: [success, data]
            properties:
              success:
                type: boolean
              data:
                type: object
                required: [id, moderationStatus, moderationNote]
                properties:
                  id:
                    type: string
                    format: uuid
                  moderationStatus:
                    $ref: '#/components/schemas/ModerationStatus'
                  moderationNote:
                    type: string
                    nullable: true
    FlagCreated:
      description: The report.
      content:
        application/json:
          schema:
            type: object
            required: [success, data]
            properties:
              success:
                type: boolean
              data:
                type: object
                required: [id, status]
                properties:
                  id:
                    type: string
                    format: uuid
                  status:
                    type: string
                    enum: [OPEN, HIDDEN, KEPT]
  schemas:
    FeaturedKind:
      type: string
      enum: [SHOP, PRODUCT]
    ModerationStatus:
      type: string
      enum: [PENDING, APPROVED, REJECTED]
    FlagTarget:
      type: string
      enum: [REVIEW, ORDER_MESSAGE]
    FlagReason:
      type: string
      enum: [SPAM, ABUSE, SCAM, PERSONAL_INFO, OFF_TOPIC, OTHER]
    FeaturedSlot:
      type: object
      required: [id, kind, targetId, sortOrder, startsAt, endsAt, liveNow, createdAt]
      properties:
        id:
          type: string
          format: uuid
        kind:
          $ref: '#/components/schemas/FeaturedKind'
        targetId:
          type: string
          format: uuid
        sortOrder:
          type: integer
        startsAt:
          type: string
          format: date-time
          nullable: true
        endsAt:
          type: string
          format: date-time
          nullable: true
        liveNow:
          type: boolean
        createdAt:
          type: string
          format: date-time
    FeaturedItem:
      type: object
      required: [slotId]
      properties:
        slotId:
          type: string
          format: uuid
        shop:
          type: object
          description: kind SHOP only.
          properties:
            id:
              type: string
              format: uuid
            name:
              type: string
            slug:
              type: string
            logoUrl:
              type: string
              nullable: true
            verificationLevel:
              $ref: '#/components/schemas/VerificationLevel'
            market:
              type: object
              nullable: true
              properties:
                name:
                  type: string
                slug:
                  type: string
        product:
          type: object
          description: kind PRODUCT only.
          properties:
            id:
              type: string
              format: uuid
            slug:
              type: string
            title:
              type: string
            image:
              type: string
              nullable: true
            thumbnail:
              type: string
              nullable: true
            msrp:
              type: integer
              nullable: true
            lowestPrice:
              type: integer
            shopCount:
              type: integer
    ModerationProduct:
      type: object
      properties:
        id:
          type: string
          format: uuid
        slug:
          type: string
        title:
          type: string
        description:
          type: string
          nullable: true
        msrp:
          type: integer
          nullable: true
        images:
          type: array
          items:
            type: string
        category:
          $ref: '#/components/schemas/IdNameSlug'
        brand:
          type: object
          nullable: true
        source:
          type: string
        shop:
          allOf:
            - $ref: '#/components/schemas/IdNameSlug'
          nullable: true
        moderationStatus:
          $ref: '#/components/schemas/ModerationStatus'
        moderationNote:
          type: string
          nullable: true
        moderatedAt:
          type: string
          format: date-time
          nullable: true
        createdAt:
          type: string
          format: date-time
    AdminFlag:
      type: object
      required: [id, targetType, targetId, reason, auto, status, reportsOnTarget, target, createdAt]
      properties:
        id:
          type: string
          format: uuid
        targetType:
          $ref: '#/components/schemas/FlagTarget'
        targetId:
          type: string
          format: uuid
        reason:
          $ref: '#/components/schemas/FlagReason'
        note:
          type: string
          nullable: true
        auto:
          type: boolean
          description: true = flagged automatically (links, phone numbers, repeated text).
        status:
          type: string
          enum: [OPEN, HIDDEN, KEPT]
        reportsOnTarget:
          type: integer
        target:
          type: object
          nullable: true
          additionalProperties: true
          description: The review (rating, comment, isHidden) or message (senderRole, body, isHidden); null if deleted.
        createdAt:
          type: string
          format: date-time
        resolvedAt:
          type: string
          format: date-time
          nullable: true
        resolutionNote:
          type: string
          nullable: true
